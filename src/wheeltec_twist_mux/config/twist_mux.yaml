# twist_mux configuration for wheeltec_ros2
#
# Priority order (higher number = wins):
#   10 → /cmd_vel_keyboard  (website joystick override — always wins)
#    6 → /cmd_vel_nav       (Nav2 autonomous navigation)
#    5 → /cmd_vel_context   (Jetson AI context-aware navigation)
#
# timeout: if no message received within this period (seconds), the source
#          is considered inactive and the next lower-priority source takes over.

twist_mux:
  ros__parameters:
    topics:
      keyboard:
        topic:    /cmd_vel_keyboard
        timeout:  0.5
        priority: 10
      context_aware:
        topic:    /cmd_vel_context
        timeout:  2.0
        priority: 5
      navigation:
        topic:    /cmd_vel_nav
        timeout:  0.5
        priority: 6
